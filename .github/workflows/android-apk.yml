          "$ZIPALIGN" -v -p 4 "$APK_UNSIGNED" "$SIGNED_APK"

          "$APKSIGNER" sign             --ks "$KEYSTORE"             --ks-pass pass:changeit             --key-pass pass:changeit             --out android/app/build/outputs/apk/release/math-master-release.apk             "$SIGNED_APK"

          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/math-master-release.apk

          rm -f "$APK_UNSIGNED" "$SIGNED_APK" "$KEYSTORE"

          echo "APK_PATH=android/app/build/outputs/apk/release/math-master-release.apk" >> "$GITHUB_ENV"

      - name: Verify signed release APK
        shell: bash
        run: |
