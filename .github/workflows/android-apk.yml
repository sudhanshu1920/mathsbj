name: Android APK

run-name: Android APK #${{ github.run_number }} — ${{ github.ref_name }}

on:
  # APK builds are manual-only after the explicitly approved build.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build web assets
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Configure Android application identity and version
        shell: bash
        env:
          VERSION_CODE: ${{ github.run_id }}
          VERSION_NAME: "1.0"
          EXPECTED_APPLICATION_ID: "com.sudhanshu.mathsbj"
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text(encoding="utf-8")
          application_id = os.environ["EXPECTED_APPLICATION_ID"]
          version_code = os.environ["VERSION_CODE"]
          version_name = os.environ["VERSION_NAME"]

          if f'applicationId "{application_id}"' not in text:
              raise SystemExit(f"Production applicationId mismatch; expected {application_id}")

          if not re.search(r'(?m)^\s*namespace\s+"'+re.escape(application_id)+r'"\s*
        run: npx cap sync android

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign release APK with production key
        shell: bash
        env:
          MATHMASTER_RELEASE_KEYSTORE_BASE64: ${{ secrets.MATHMASTER_RELEASE_KEYSTORE_BASE64 }}
          MATHMASTER_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.MATHMASTER_RELEASE_KEYSTORE_PASSWORD }}
          MATHMASTER_RELEASE_KEY_ALIAS: ${{ secrets.MATHMASTER_RELEASE_KEY_ALIAS }}
          MATHMASTER_RELEASE_KEY_PASSWORD: ${{ secrets.MATHMASTER_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in MATHMASTER_RELEASE_KEYSTORE_BASE64 MATHMASTER_RELEASE_KEYSTORE_PASSWORD MATHMASTER_RELEASE_KEY_ALIAS MATHMASTER_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required production signing secret: ${name}"
              echo "::error::The original signing key is required for direct APK updates over the installed app."
              exit 1
            fi
          done

          APK_UNSIGNED="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_UNSIGNED"
          test -s "$APK_UNSIGNED"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"

          KEYSTORE="$RUNNER_TEMP/math-master-production-release.jks"
          printf '%s' "$MATHMASTER_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"

          keytool -list -v \
            -keystore "$KEYSTORE" \
            -storepass "$MATHMASTER_RELEASE_KEYSTORE_PASSWORD" \
            -alias "$MATHMASTER_RELEASE_KEY_ALIAS" >/dev/null

          SIGNED_APK="$RUNNER_TEMP/math-master-release-aligned.apk"
          OUTPUT_APK="android/app/build/outputs/apk/release/math-master-release.apk"

          "$ZIPALIGN" -v -p 4 "$APK_UNSIGNED" "$SIGNED_APK"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-pass "pass:$MATHMASTER_RELEASE_KEYSTORE_PASSWORD" \
            --ks-key-alias "$MATHMASTER_RELEASE_KEY_ALIAS" \
            --key-pass "pass:$MATHMASTER_RELEASE_KEY_PASSWORD" \
            --out "$OUTPUT_APK" \
            "$SIGNED_APK"

          "$APKSIGNER" verify --verbose "$OUTPUT_APK"
          rm -f "$APK_UNSIGNED" "$SIGNED_APK" "$KEYSTORE"
          echo "APK_PATH=$OUTPUT_APK" >> "$GITHUB_ENV"

      - name: Verify signed release APK identity and version
        shell: bash
        env:
          EXPECTED_VERSION_CODE: ${{ github.run_id }}
          EXPECTED_VERSION_NAME: "1.0"
          EXPECTED_APPLICATION_ID: "com.sudhanshu.mathsbj"
          MATHMASTER_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.MATHMASTER_RELEASE_KEYSTORE_PASSWORD }}
          MATHMASTER_RELEASE_KEY_ALIAS: ${{ secrets.MATHMASTER_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -s "$APK_PATH"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT2="$BUILD_TOOLS/aapt2"
          test -x "$APKSIGNER"
          test -x "$AAPT2"

          "$APKSIGNER" verify --verbose "$APK_PATH"

          badging="$("$AAPT2" dump badging "$APK_PATH")"
          echo "$badging" | grep -q "package: name='$EXPECTED_APPLICATION_ID' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'"

          expected_fp="$(
            keytool -exportcert -rfc \
              -keystore "$RUNNER_TEMP/math-master-production-release.jks" \
              -storepass "$MATHMASTER_RELEASE_KEYSTORE_PASSWORD" \
              -alias "$MATHMASTER_RELEASE_KEY_ALIAS" 2>/dev/null |
            openssl x509 -noout -fingerprint -sha256 |
            sed 's/.*=//' | tr -d ':' | tr '[:lower:]' '[:upper:]'
          )"

          actual_fp="$(
            "$APKSIGNER" verify --print-certs "$APK_PATH" 2>&1 |
            awk -F': ' '/certificate SHA-256 digest/ { print $2; exit }' |
            tr -d ':' | tr '[:lower:]' '[:upper:]'
          )"

          test -n "$expected_fp"
          test -n "$actual_fp"
          test "$expected_fp" = "$actual_fp"

          sha256sum "$APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: math-master-android-release
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
, text):
              raise SystemExit("Android namespace does not match the production applicationId")

          text, count = re.subn(r'(?m)^(\s*)versionCode\s+\d+\s*
        run: npx cap sync android

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign release APK
        shell: bash
        run: |
          set -euo pipefail

          APK_UNSIGNED="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_UNSIGNED"
          test -s "$APK_UNSIGNED"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          KEYSTORE="$RUNNER_TEMP/math-master-release.jks"
          SIGNED_APK="$RUNNER_TEMP/math-master-release-aligned.apk"

          keytool -genkeypair             -keystore "$KEYSTORE"             -storepass changeit             -keypass changeit             -alias math-master             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Math Master, O=SBJ, C=IN"

          "$ZIPALIGN" -v -p 4 "$APK_UNSIGNED" "$SIGNED_APK"

          "$APKSIGNER" sign             --ks "$KEYSTORE"             --ks-pass pass:changeit             --key-pass pass:changeit             --out android/app/build/outputs/apk/release/math-master-release.apk             "$SIGNED_APK"

          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/math-master-release.apk

          rm -f "$APK_UNSIGNED" "$SIGNED_APK" "$KEYSTORE"

          echo "APK_PATH=android/app/build/outputs/apk/release/math-master-release.apk" >> "$GITHUB_ENV"

      - name: Verify signed release APK
        shell: bash
        run: |
          set -euo pipefail
          test -s "$APK_PATH"
          sha256sum "$APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: math-master-android-release
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
, r'\g<1>versionCode '+version_code, text, count=1)
          if count != 1:
              raise SystemExit("Expected exactly one generated versionCode declaration")

          text, count = re.subn(r'(?m)^(\s*)versionName\s+"[^"]*"\s*
