<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>SBJ Math app logo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020914"/><stop offset="0.55" stop-color="#07111f"/><stop offset="1" stop-color="#020914"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1ddfff"/><stop offset="0.5" stop-color="#08aaf5"/><stop offset="1" stop-color="#0786e8"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#f4f5f7"/><stop offset="1" stop-color="#d7dbe0"/></linearGradient>
    <path id="bottomArc" d="M 225,855 A 335,335 0 0 0 799,855" fill="none"/>
  </defs>
  <rect width="1024" height="1024" rx="175" fill="url(#bg)"/>
  <circle cx="512" cy="505" r="347" fill="none" stroke="#034f8d" stroke-opacity="0.28" stroke-width="38"/>
  <circle cx="512" cy="505" r="347" fill="none" stroke="url(#blue)" stroke-width="27" stroke-linecap="round" stroke-dasharray="860 160" transform="rotate(-30 512 505)"/>
  <g font-family="Arial,Helvetica,sans-serif" font-weight="800" text-anchor="middle">
    <text x="357" y="286" font-size="102" fill="#ffffff">+</text>
    <text x="667" y="286" font-size="102" fill="#ffffff">−</text>
    <text x="275" y="365" font-size="100" fill="#0aa9f5">×</text>
    <text x="748" y="365" font-size="90" fill="#0aa9f5">÷</text>
    <text x="480" y="284" font-size="102" fill="url(#blue)">√</text>
    <text x="546" y="284" font-size="102" fill="#ffffff">x</text>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" font-weight="900" text-anchor="middle">
    <g fill="#000000" opacity="0.62" transform="translate(0 12)">
      <text x="324" y="585" font-size="300" letter-spacing="-38">S</text>
      <text x="512" y="585" font-size="300" letter-spacing="-32">B</text>
      <text x="704" y="585" font-size="300" letter-spacing="-38">J</text>
    </g>
    <text x="324" y="585" font-size="300" fill="url(#silver)" letter-spacing="-38">S</text>
    <text x="512" y="585" font-size="300" fill="url(#blue)" letter-spacing="-32">B</text>
    <text x="704" y="585" font-size="300" fill="url(#silver)" letter-spacing="-38">J</text>
  </g>
  <g transform="translate(396 650)">
    <rect x="0" y="10" width="232" height="220" rx="38" fill="#000000" opacity="0.55"/>
    <rect x="0" y="0" width="232" height="220" rx="38" fill="#07111f" stroke="#0aa9f5" stroke-width="15"/>
    <rect x="39" y="28" width="154" height="50" rx="9" fill="#1e252c" stroke="#0b1825" stroke-width="4"/>
    <g fill="#f5f6f7">
      <rect x="28" y="102" width="53" height="43" rx="8"/><rect x="89" y="102" width="53" height="43" rx="8"/>
      <rect x="28" y="155" width="53" height="43" rx="8"/><rect x="89" y="155" width="53" height="43" rx="8"/>
    </g>
    <rect x="151" y="102" width="49" height="96" rx="9" fill="url(#blue)"/>
    <g font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" text-anchor="middle" dominant-baseline="middle">
      <text x="54.5" y="124" fill="#0a1723">+</text><text x="115.5" y="124" fill="#0a1723">−</text>
      <text x="54.5" y="177" fill="#0a1723">×</text><text x="115.5" y="177" fill="#0a1723">÷</text>
      <text x="175.5" y="151" fill="#ffffff" font-size="38">=</text>
    </g>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="800" letter-spacing="6" fill="#ffffff">
    <text><textPath href="#bottomArc" startOffset="50%" text-anchor="middle">MATH · CALCULATE · SUCCEED</textPath></text>
