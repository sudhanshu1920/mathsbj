name: Build Math SBJ Android APK

on:
  push:
    branches: [apk-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure client environment
        env:
          VITE_SUPABASE_PROJECT_ID: tkgogvbfxzookxlqjdtt
          VITE_SUPABASE_URL: https://tkgogvbfxzookxlqjdtt.supabase.co
          # Supabase publishable (anon) key is client-safe by design; never use the service_role key here.
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrZ29ndmJmeHpvb2t4bHFqZHR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MzEzMzUsImV4cCI6MjA5MzQwNzMzNX0.0yi-NBaydyQr_f9sMKhSrETkQI4sWi8C_iM7KRlOZtk
        run: |
          printf 'VITE_SUPABASE_PROJECT_ID=%s\nVITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\n' \
            "$VITE_SUPABASE_PROJECT_ID" "$VITE_SUPABASE_URL" "$VITE_SUPABASE_PUBLISHABLE_KEY" > .env.production

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Run full lint audit
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/full-lint.log || {
            echo "::warning::Repository-wide lint has legacy errors outside the production-critical path. See the log above."
          }

      - name: Run critical-path lint
        run: npx eslint src/pages/Index.tsx src/pages/LearningPage.tsx src/components/SwipeBack.tsx src/components/SwipeContainer.tsx src/components/PeriodicTableLearning.tsx src/components/OfflinePrep.tsx src/test/mathData.test.ts

      - name: Run unit tests
        run: npm test

      - name: Production dependency security audit
        run: |
          npm audit --omit=dev --audit-level=critical
          npm ls --omit=dev --depth=0

      - name: Full dependency security report
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Build web app
        run: npm run build

      - name: Validate client configuration in build
        env:
          VITE_SUPABASE_URL: https://tkgogvbfxzookxlqjdtt.supabase.co
        run: |
          test -s .env.production
          grep -F "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" .env.production
          ! grep -F '\\$VITE_SUPABASE_URL' dist/assets/*.js
          ! grep -F '\\$VITE_SUPABASE_PUBLISHABLE_KEY' dist/assets/*.js
          grep -R -F "$VITE_SUPABASE_URL" dist/assets >/dev/null

      - name: Install Capacitor
        run: npm install --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/app@8

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.sudhanshu1920.mathsbj',
            appName: 'Math SBJ',
            webDir: 'dist',
          };

          export default config;
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Android release metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_gradle = Path("android/app/build.gradle")
          text = app_gradle.read_text()

          replacements = [
              (r'(?m)^\s*applicationId\s+"[^"]+"', '        applicationId "com.sudhanshu1920.mathsbj"'),
              (r'(?m)^\s*versionCode\s+\d+', '        versionCode 1'),
              (r'(?m)^\s*versionName\s+"[^"]+"', '        versionName "1.0.0"'),
          ]
          for pattern, value in replacements:
              text, count = re.subn(pattern, value, text, count=1)
              if count != 1:
                  raise SystemExit(f"Could not patch android/app/build.gradle: {pattern}")
          app_gradle.write_text(text)

          variables = Path("android/variables.gradle")
          if variables.exists():
              text = variables.read_text()
              for key, value in (("minSdkVersion", "24"), ("compileSdkVersion", "36"), ("targetSdkVersion", "36")):
                  text, count = re.subn(rf'(?m)^\s*{key}\s*=\s*\d+', f'{key} = {value}', text, count=1)
                  if count != 1:
                      raise SystemExit(f"Could not set {key} in android/variables.gradle")
              variables.write_text(text)
          PY

      - name: Install image tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick

      - name: Generate Android launcher icons from repository favicon
        run: |
          IMG_CMD="$(command -v magick || command -v convert || true)"
          if [ -z "$IMG_CMD" ]; then
            echo "ImageMagick installation failed"
            exit 1
          fi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          "$IMG_CMD" public/favicon.ico -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          "$IMG_CMD" public/favicon.ico -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          "$IMG_CMD" public/favicon.ico -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          "$IMG_CMD" public/favicon.ico -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          "$IMG_CMD" public/favicon.ico -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_foreground.xml

      - name: Sync web assets
        run: npx cap sync android

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK metadata and packages
        run: |
          set -e
          test -f android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          APKANALYZER="${ANDROID_HOME}/cmdline-tools/latest/bin/apkanalyzer"
          "$APKANALYZER" manifest application-id android/app/build/outputs/apk/release/app-release-unsigned.apk | grep -Fx 'com.sudhanshu1920.mathsbj'
          "$APKANALYZER" manifest version-name android/app/build/outputs/apk/release/app-release-unsigned.apk | grep -Fx '1.0.0'
          "$APKANALYZER" manifest min-sdk android/app/build/outputs/apk/release/app-release-unsigned.apk | grep -Fx '24'
          "$APKANALYZER" manifest target-sdk android/app/build/outputs/apk/release/app-release-unsigned.apk | grep -Fx '36'
          file android/app/build/outputs/apk/release/app-release-unsigned.apk
          file android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release artifact
        run: |
          set -e
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/Math-SBJ-release-unsigned.apk
          sha256sum artifacts/Math-SBJ-release-unsigned.apk > artifacts/Math-SBJ-release-unsigned.apk.sha256

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: math-sbj-release-apk-v2
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: math-sbj-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
