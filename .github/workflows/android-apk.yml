name: Android APK

run-name: Android APK #${{ github.run_number }} — ${{ github.ref_name }}

on:
  # Manual release builds are the default; the scoped push trigger is used only
  # for the explicitly approved build requested in this turn.
  workflow_dispatch:
  push:
    paths:
      - 'APK_BUILD_TRIGGER.txt'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Record build run
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > APK_BUILD_RUN_ID.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add APK_BUILD_RUN_ID.txt
          git commit -m "ci: record APK run $GITHUB_RUN_ID"
          git push

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build web assets
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign release APK
        shell: bash
        run: |
          set -euo pipefail

          APK_UNSIGNED="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_UNSIGNED"
          test -s "$APK_UNSIGNED"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          KEYSTORE="$RUNNER_TEMP/math-master-release.jks"
          SIGNED_APK="$RUNNER_TEMP/math-master-release-aligned.apk"

          keytool -genkeypair             -keystore "$KEYSTORE"             -storepass changeit             -keypass changeit             -alias math-master             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Math Master, O=SBJ, C=IN"

          "$ZIPALIGN" -v -p 4 "$APK_UNSIGNED" "$SIGNED_APK"

          "$APKSIGNER" sign             --ks "$KEYSTORE"             --ks-pass pass:changeit             --key-pass pass:changeit             --out android/app/build/outputs/apk/release/math-master-release.apk             "$SIGNED_APK"

          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/math-master-release.apk

          rm -f "$APK_UNSIGNED" "$SIGNED_APK" "$KEYSTORE"

          echo "APK_PATH=android/app/build/outputs/apk/release/math-master-release.apk" >> "$GITHUB_ENV"

      - name: Verify signed release APK
        shell: bash
        run: |
          set -euo pipefail
          test -s "$APK_PATH"
          sha256sum "$APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: math-master-android-release
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
