name: Build Math SBJ APK

on:
  push:
    branches: [apk-build]
  workflow_dispatch:

permissions:
  contents: read
# APK build is kept on a dedicated branch so main remains untouched.

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure client environment
        env:
          VITE_SUPABASE_PROJECT_ID: tkgogvbfxzookxlqjdtt
          VITE_SUPABASE_URL: https://tkgogvbfxzookxlqjdtt.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrZ29ndmJmeHpvb2t4bHFqZHR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MzEzMzUsImV4cCI6MjA5MzQwNzMzNX0.0yi-NBaydyQr_f9sMKhSrETkQI4sWi8C_iM7KRlOZtk
        run: |
          cat > .env.production <<'EOF'
          VITE_SUPABASE_PROJECT_ID=$VITE_SUPABASE_PROJECT_ID
          VITE_SUPABASE_URL=$VITE_SUPABASE_URL
          VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY
          EOF

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Install Capacitor
        run: npm install --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.sudhanshu1920.mathsbj',
            appName: 'Math SBJ',
            webDir: 'dist',
          };

          export default config;
          EOF

      - name: Prepare Android SDK
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: math-sbj-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
