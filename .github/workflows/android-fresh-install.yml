name: Android Fresh Install APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-fresh-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[BUILD_FRESH_APK]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Prepare app logo
        shell: bash
        run: |
          set -euo pipefail
          test -s public/app-icon.svg
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick librsvg2-bin
          convert -background none public/app-icon.svg -resize 1024x1024 public/app-icon.png
          identify -format '%wx%h' public/app-icon.png | grep -qx '1024x1024'

      - name: Build web application
        run: npm run build

      - name: Install Capacitor Android tooling
        run: npm install --no-save @capacitor/cli@8.5.2 @capacitor/android@8.5.2

      - name: Generate Android project
        run: npx cap add android

      - name: Configure Android identity and version
        shell: bash
        env:
          VERSION_NAME: "1.0"
          EXPECTED_APPLICATION_ID: "com.sudhanshu.mathsbj"
        run: |
          set -euo pipefail
          VERSION_CODE="$(git rev-list --count HEAD)"
          test "$VERSION_CODE" -gt 1
          export VERSION_CODE
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("android/app/build.gradle")
          lines = path.read_text(encoding="utf-8").splitlines()
          expected_id = os.environ["EXPECTED_APPLICATION_ID"]
          version_code = os.environ["VERSION_CODE"]
          version_name = os.environ["VERSION_NAME"]

          if not any(line.strip() == f'applicationId "{expected_id}"' for line in lines):
              raise SystemExit(f"Production applicationId mismatch; expected {expected_id}")
          if not any(line.strip().startswith("namespace ") for line in lines):
              raise SystemExit("Android namespace is missing")

          code_updated = False
          name_updated = False
          for i, line in enumerate(lines):
              stripped = line.strip()
              indent = line[:len(line) - len(line.lstrip())]
              if stripped.startswith("versionCode ") and not code_updated:
                  lines[i] = f"{indent}versionCode {version_code}"
                  code_updated = True
              elif stripped.startswith("versionName ") and not name_updated:
                  lines[i] = f'{indent}versionName "{version_name}"'
                  name_updated = True

          if not code_updated or not name_updated:
              raise SystemExit("Android version declarations not found")

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Configure Android edge-to-edge system bars
        shell: bash
        run: |
          set -euo pipefail
          main_activity="android/app/src/main/java/com/sudhanshu/mathsbj/MainActivity.java"
          test -f "$main_activity"
          cat > "$main_activity" <<'JAVA'
          package com.sudhanshu.mathsbj;

          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();
                  window.setStatusBarColor(Color.TRANSPARENT);
                  window.setNavigationBarColor(Color.TRANSPARENT);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      window.setNavigationBarContrastEnforced(false);
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.setDecorFitsSystemWindows(false);
                  } else {
                      window.getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      );
                  }
              }
          }
          JAVA

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate and apply launcher icons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p resources
          cp public/app-icon.png resources/icon.png
          npx --yes @capacitor/assets@3.0.5 generate --android
          declare -A sizes=([mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192)
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir="android/app/src/main/res/mipmap-${density}"
            test -d "$dir"
            size="${sizes[$density]}"
            rsvg-convert -w "$size" -h "$size" public/app-icon.svg -o "$dir/ic_launcher.png"
            rsvg-convert -w "$size" -h "$size" public/app-icon.svg -o "$dir/ic_launcher_round.png"
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Configure one-off fresh signing
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/math-master-fresh-release.jks"
          store_password="$(openssl rand -hex 32)"
          key_alias="math-master-fresh"
          key_password="$store_password"

          keytool -genkeypair -v \
            -keystore "$keystore" \
            -storepass "$store_password" \
            -keypass "$key_password" \
            -alias "$key_alias" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Math Master Fresh,O=SBJ Sigma,C=IN"

          {
            echo "MATHMASTER_FRESH_KEYSTORE_PATH=$keystore"
            echo "MATHMASTER_FRESH_KEYSTORE_PASSWORD=$store_password"
            echo "MATHMASTER_FRESH_KEY_ALIAS=$key_alias"
            echo "MATHMASTER_FRESH_KEY_PASSWORD=$key_password"
          } >> "$GITHUB_ENV"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text(encoding="utf-8")

          marker = "android {"
          signing = """android {
              signingConfigs {
                  freshRelease {
                      storeFile file(System.getenv("MATHMASTER_FRESH_KEYSTORE_PATH"))
                      storePassword System.getenv("MATHMASTER_FRESH_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("MATHMASTER_FRESH_KEY_ALIAS")
                      keyPassword System.getenv("MATHMASTER_FRESH_KEY_PASSWORD")
                  }
              }
          """

          if text.count(marker) != 1:
              raise SystemExit("Expected exactly one android { block")
          text = text.replace(marker, signing, 1)

          target = "buildTypes {\n        release {"
          replacement = """buildTypes {
                  release {
                      signingConfig signingConfigs.freshRelease"""
          if target not in text:
              raise SystemExit("Expected release buildTypes block not found")
          text = text.replace(target, replacement, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK
        shell: bash
        env:
          EXPECTED_VERSION_NAME: "1.0"
          EXPECTED_APPLICATION_ID: "com.sudhanshu.mathsbj"
        run: |
          set -euo pipefail
          EXPECTED_VERSION_CODE="$(git rev-list --count HEAD)"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT2="$BUILD_TOOLS/aapt2"
          apk="$(find android/app/build/outputs/apk/release -type f -name '*release*.apk' | head -n 1)"
          test -n "$apk"

          "$APKSIGNER" verify --verbose "$apk"
          badging="$("$AAPT2" dump badging "$apk")"
          echo "$badging" | grep -q "package: name='$EXPECTED_APPLICATION_ID' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'"

          "$APKSIGNER" verify --print-certs "$apk"
          sha256sum "$apk"
          cp "$apk" MathMaster-fresh-release.apk

      - name: Upload fresh release APK
        uses: actions/upload-artifact@v4
        with:
          name: MathMaster-fresh-release
          path: MathMaster-fresh-release.apk
          if-no-files-found: error
          retention-days: 14
