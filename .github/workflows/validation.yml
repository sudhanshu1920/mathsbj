name: Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # Validate the same no-login mode shipped in Android releases.
    env:
      VITE_OFFLINE_MODE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Architecture regression checks
        run: npm run regression:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test


      - name: Build web assets
        run: npm run build

      - name: Set up Java 21 for native Android verification
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Capacitor Android build tooling
        run: npm install --no-save @capacitor/cli@8.5.2 @capacitor/android@8.5.2

      - name: Generate Android project for native smoke test
        run: npx cap add android

      - name: Prepare updater plugin registration for native smoke test
        shell: bash
        run: |
          set -euo pipefail
          plugin_dir="android/app/src/main/java/com/sudhanshu/mathsbj"
          mkdir -p "$plugin_dir"
          cat > "$plugin_dir/AppUpdaterPlugin.java" <<'JAVA'
          package com.sudhanshu.mathsbj;

          import com.getcapacitor.Plugin;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "AppUpdater")
          public class AppUpdaterPlugin extends Plugin {}
          JAVA
          cat > "$plugin_dir/MainActivity.java" <<'JAVA'
          package com.sudhanshu.mathsbj;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AppUpdaterPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

      - name: Configure native notifications
        run: node scripts/configure-android-notifications.mjs

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Compile native Android debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: math-master-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
