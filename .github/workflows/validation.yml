name: Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # Validate the same no-login mode shipped in Android releases.
    env:
      VITE_OFFLINE_MODE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Architecture regression checks
        run: npm run regression:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build web assets
        run: npm run build
