name: Android Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-android:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        (startsWith(github.event.head_commit.message, '[BUILD_APK]') ||
         startsWith(github.event.head_commit.message, '[BUILD_ANDROID_APK]')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Release versioning unit tests
        run: node --test scripts/release-version.test.mjs

      - name: Architecture regression checks
        run: npm run regression:check


      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Resolve automatic release version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release-version.mjs > "$RUNNER_TEMP/release-version.json"
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          data = json.loads(Path(os.environ["RUNNER_TEMP"] + "/release-version.json").read_text(encoding="utf-8"))
          version_code = data.get("versionCode")
          version_name = data.get("versionName")
          source_commit = data.get("sourceCommit")
          current_commit = os.environ["GITHUB_SHA"].lower()
          if not isinstance(version_code, int) or version_code < 1 or version_code > 2100000000:
              raise SystemExit("Resolved Android versionCode is invalid")
          if not isinstance(version_name, str) or not re.fullmatch(r"\d+\.\d+\.\d+", version_name):
              raise SystemExit("Resolved Android versionName must be semantic X.Y.Z")
          if source_commit != current_commit:
              raise SystemExit("Resolved version is not associated with the checked-out source commit")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"VERSION_CODE={version_code}\n")
              env_file.write(f"VERSION_NAME={version_name}\n")
              env_file.write(f"VITE_APP_VERSION_CODE={version_code}\n")
              env_file.write(f"VITE_APP_VERSION_NAME={version_name}\n")
          print(f"Resolved release version: {version_name} (versionCode {version_code})")
          PY
      - name: Prepare supplied SBJ app logo
        shell: bash
        run: |
          set -euo pipefail
          test -s public/app-icon.svg
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick librsvg2-bin
          convert -background none public/app-icon.svg -resize 1024x1024 public/app-icon.png
          identify -format '%wx%h' public/app-icon.png | grep -qx '1024x1024'
          test -s public/app-icon.png

      - name: Build web application (offline guest mode)
        env:
          VITE_OFFLINE_MODE: "true"
        run: npm run build

      - name: Install Capacitor Android build tooling
        run: npm install --no-save @capacitor/cli@8.5.2 @capacitor/android@8.5.2

      - name: Generate Android project from repository source
        run: npx cap add android

      - name: Configure Android application identity and version
        shell: bash
        env:
          EXPECTED_APPLICATION_ID: "com.sudhanshu.mathsbj"
        run: |
          set -euo pipefail
          VERSION_CODE="${VERSION_CODE:?Missing resolved versionCode}"
          VERSION_NAME="${VERSION_NAME:?Missing resolved versionName}"
          export VERSION_CODE VERSION_NAME
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("android/app/build.gradle")
          lines = path.read_text(encoding="utf-8").splitlines()
          expected_id = os.environ["EXPECTED_APPLICATION_ID"]
          version_code = int(os.environ["VERSION_CODE"])
          version_name = os.environ["VERSION_NAME"]
          if version_code < 1 or version_code > 2100000000:
              raise SystemExit("Android versionCode is out of range")
          if not re.fullmatch(r"\d+\.\d+\.\d+", version_name):
              raise SystemExit("Android versionName must be semantic X.Y.Z")

          app_id_ok = any(line.strip() == f'applicationId "{expected_id}"' for line in lines)
          namespace_ok = any(line.strip().startswith("namespace ") for line in lines)
          if not app_id_ok:
              raise SystemExit(f"Production applicationId mismatch; expected {expected_id}")
          if not namespace_ok:
              raise SystemExit("Android namespace is missing")

          code_updated = False
          name_updated = False
          for i, line in enumerate(lines):
              stripped = line.strip()
              indent = line[:len(line) - len(line.lstrip())]
              if stripped.startswith("versionCode ") and not code_updated:
                  lines[i] = f"{indent}versionCode {version_code}"
                  code_updated = True
              elif stripped.startswith("versionName ") and not name_updated:
                  lines[i] = f'{indent}versionName "{version_name}"'
                  name_updated = True

          if not code_updated:
              raise SystemExit("versionCode declaration not found")
          if not name_updated:
              raise SystemExit("versionName declaration not found")

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Add native Android in-app updater
        shell: bash
        run: |
          set -euo pipefail

          plugin_dir="android/app/src/main/java/com/sudhanshu/mathsbj"
          mkdir -p "$plugin_dir"

          cat > "$plugin_dir/AppUpdaterPlugin.java" <<'JAVA'
          package com.sudhanshu.mathsbj;

          import android.Manifest;
          import android.app.DownloadManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.content.pm.Signature;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.SystemClock;
          import android.content.SharedPreferences;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.widget.Toast;
          import androidx.core.content.FileProvider;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.security.MessageDigest;
          import java.util.Locale;
          import java.util.Set;
          import java.util.TreeSet;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          @CapacitorPlugin(
              name = "AppUpdater",
              permissions = {
                  @Permission(alias = "legacyDownloads", strings = { Manifest.permission.WRITE_EXTERNAL_STORAGE })
              }
          )
          public class AppUpdaterPlugin extends Plugin {
              private static final String TRUSTED_APK_PATH =
                  "/sudhanshu1920/mathsbj-updates/releases/download/latest/MathMaster-release.apk";
              private static final String DOWNLOAD_EVENT = "downloadState";
              private static final String UPDATE_CHANNEL_ID = "app_updates";
              private static final String DOWNLOAD_PREFS = "math_app_update_downloads";
              private final Set<Long> monitoredDownloads =
                  java.util.Collections.synchronizedSet(new java.util.HashSet<Long>());

              @PluginMethod
              public void getVersion(PluginCall call) {
                  try {
                      PackageInfo info = getContext().getPackageManager().getPackageInfo(getContext().getPackageName(), 0);
                      long versionCode = Build.VERSION.SDK_INT >= Build.VERSION_CODES.P
                          ? info.getLongVersionCode()
                          : info.versionCode;

                      JSObject result = new JSObject();
                      result.put("versionCode", versionCode);
                      result.put("versionName", info.versionName);
                      call.resolve(result);
                  } catch (Exception e) {
                      call.reject("Unable to read app version.", e);
                  }
              }

              @PluginMethod
              public void downloadAndInstall(PluginCall call) {
                  startUpdateDownload(call, false);
              }

              @PluginMethod
              public void downloadToDownloads(PluginCall call) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q
                      && getContext().checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissionForAlias("legacyDownloads", call, "legacyDownloadsPermissionResult");
                      return;
                  }
                  startUpdateDownload(call, true);
              }

              @PermissionCallback
              private void legacyDownloadsPermissionResult(PluginCall call) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q
                      && getContext().checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE)
                          != PackageManager.PERMISSION_GRANTED) {
                      call.reject("DOWNLOAD_PERMISSION_REQUIRED");
                      return;
                  }
                  startUpdateDownload(call, true);
              }

          private synchronized void startUpdateDownload(PluginCall call, boolean downloadOnly) {
            String url = call.getString("url");
            Uri updateUri = url == null ? null : Uri.parse(url);
            String expectedSha256 = call.getString("sha256");
            Integer expectedVersionCode = call.getInt("versionCode");
            String versionName = call.getString("versionName");
            if (updateUri == null
                || !"https".equalsIgnoreCase(updateUri.getScheme())
                || !"github.com".equalsIgnoreCase(updateUri.getHost())
                || updateUri.getPort() != -1
                || updateUri.getUserInfo() != null
                || !TRUSTED_APK_PATH.equals(updateUri.getPath())
                || updateUri.getQuery() != null
                || updateUri.getFragment() != null
                || expectedSha256 == null
                || !expectedSha256.matches("(?i)[a-f0-9]{64}")
                || expectedVersionCode == null
                || expectedVersionCode <= 0
                || expectedVersionCode > 2100000000
                || versionName == null
                || !versionName.matches("[0-9]+\\.[0-9]+\\.[0-9]+")) {
              call.reject("Update APK source or version is not trusted.");
              return;
            }

            final PackageInfo installedInfo;
            final long installedVersionCode;
            try {
              int flags = Build.VERSION.SDK_INT >= Build.VERSION_CODES.P
                  ? PackageManager.GET_SIGNING_CERTIFICATES
                  : PackageManager.GET_SIGNATURES;
              installedInfo = getContext().getPackageManager()
                  .getPackageInfo(getContext().getPackageName(), flags);
              installedVersionCode = Build.VERSION.SDK_INT >= Build.VERSION_CODES.P
                  ? installedInfo.getLongVersionCode()
                  : installedInfo.versionCode;
            } catch (Exception versionError) {
              call.reject("Unable to verify the installed app version.", versionError);
              return;
            }
            if (expectedVersionCode.longValue() <= installedVersionCode) {
              call.reject("The update is not newer than the installed app.");
              return;
            }

            if (!downloadOnly && Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                && !getContext().getPackageManager().canRequestPackageInstalls()) {
              Intent settings = new Intent(
                  Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                  Uri.parse("package:" + getContext().getPackageName())
              );
              try {
                getActivity().startActivity(settings);
              } catch (Exception settingsError) {
                call.reject("Unable to open Android install-permission settings.", settingsError);
                return;
              }
              call.reject("INSTALL_PERMISSION_REQUIRED");
              return;
            }

            try {
              File destinationDirectory = getContext().getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
              if (destinationDirectory == null
                  || (!destinationDirectory.exists() && !destinationDirectory.mkdirs())) {
                call.reject("Unable to prepare the verified update download location.");
                return;
              }

              String stagedName = "MathMaster-update-" + expectedVersionCode + ".apk";
              File destinationFile = new File(destinationDirectory, stagedName);
              DownloadManager manager =
                  (DownloadManager) getContext().getSystemService(Context.DOWNLOAD_SERVICE);
              if (manager == null) {
                call.reject("Android Download Manager is unavailable.");
                return;
              }

              SharedPreferences preferences =
                  getContext().getSharedPreferences(DOWNLOAD_PREFS, Context.MODE_PRIVATE);
              String downloadKey = "download_id_" + expectedVersionCode;
              String shaKey = "sha256_" + expectedVersionCode;
              long existingId = preferences.getLong(downloadKey, -1L);
              String previousSha = preferences.getString(shaKey, null);

              // DownloadManager keeps paused/partial transfers across process death. Reuse
              // the original job instead of deleting its destination and starting from 0.
              if (existingId > 0L) {
                if (expectedSha256.equalsIgnoreCase(previousSha)) {
                  int existingStatus = readDownloadStatus(manager, existingId);
                  boolean active = existingStatus == DownloadManager.STATUS_PENDING
                      || existingStatus == DownloadManager.STATUS_RUNNING
                      || existingStatus == DownloadManager.STATUS_PAUSED;
                  boolean completedFileReady = existingStatus == DownloadManager.STATUS_SUCCESSFUL
                      && destinationFile.isFile() && destinationFile.length() > 0L;
                  if (active || completedFileReady) {
                    monitorDownload(manager, existingId, destinationFile, expectedSha256,
                        expectedVersionCode, versionName, installedInfo, installedVersionCode,
                        downloadOnly, preferences, downloadKey, shaKey);
                    JSObject result = new JSObject();
                    result.put("downloadId", existingId);
                    call.resolve(result);
                    return;
                  }
                }
                // A changed checksum means the mutable /latest asset is a different file.
                // Cancel the old job before touching its destination.
                manager.remove(existingId);
              }

              preferences.edit().remove(downloadKey).remove(shaKey).apply();
              if (destinationFile.exists() && !destinationFile.delete()) {
                call.reject("Unable to replace a previous incomplete update download.");
                return;
              }

              DownloadManager.Request request = new DownloadManager.Request(updateUri);
              request.setTitle(downloadOnly ? "Math App APK download" : "Math App update");
              request.setDescription(downloadOnly
                  ? "Downloading and verifying the APK before saving it to Downloads"
                  : "Downloading the latest Math App APK");
              request.setMimeType("application/octet-stream");
              request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE);
              // Let Android use either Wi-Fi or mobile data; do not silently force Wi-Fi.
              request.setAllowedNetworkTypes(
                  DownloadManager.Request.NETWORK_WIFI | DownloadManager.Request.NETWORK_MOBILE);
              request.setAllowedOverMetered(true);
              request.setAllowedOverRoaming(false);
              request.setDestinationInExternalFilesDir(
                  getContext(), Environment.DIRECTORY_DOWNLOADS, stagedName);

              long downloadId = manager.enqueue(request);
              preferences.edit().putLong(downloadKey, downloadId).putString(shaKey, expectedSha256).apply();

              monitorDownload(manager, downloadId, destinationFile, expectedSha256,
                  expectedVersionCode, versionName, installedInfo, installedVersionCode,
                  downloadOnly, preferences, downloadKey, shaKey);

              JSObject result = new JSObject();
              result.put("downloadId", downloadId);
              call.resolve(result);
            } catch (Exception e) {
              call.reject("Unable to start the APK download.", e);
            }
          }

          private int readDownloadStatus(DownloadManager manager, long downloadId) {
            DownloadManager.Query query = new DownloadManager.Query().setFilterById(downloadId);
            try (Cursor cursor = manager.query(query)) {
              if (cursor != null && cursor.moveToFirst()) {
                return cursor.getInt(cursor.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS));
              }
            } catch (Exception ignored) {
              // A missing DownloadManager row is treated as stale and replaced safely.
            }
            return -1;
          }

          private void monitorDownload(
              DownloadManager manager,
              long downloadId,
              File destinationFile,
              String expectedSha256,
              Integer expectedVersionCode,
              String versionName,
              PackageInfo installedInfo,
              long installedVersionCode,
              boolean downloadOnly,
              SharedPreferences preferences,
              String downloadKey,
              String shaKey) {
            synchronized (monitoredDownloads) {
              if (!monitoredDownloads.add(downloadId)) return;
            }

            Handler mainHandler = new Handler(getContext().getMainLooper());
            long monitorStartedAt = SystemClock.elapsedRealtime();
            final long[] previousBytes = { -1L };
            final long[] previousSampleAt = { monitorStartedAt };
            final int[] queryFailures = { 0 };

            Runnable poll = new Runnable() {
              @Override
              public void run() {
                long nextPollDelay = 1500L;
                try (Cursor cursor = manager.query(new DownloadManager.Query().setFilterById(downloadId))) {
                  if (cursor == null || !cursor.moveToFirst()) {
                    if (++queryFailures[0] > 3) {
                      monitoredDownloads.remove(downloadId);
                      failDownload(manager, downloadId, destinationFile, preferences, downloadKey, shaKey,
                          "Unable to read the update download status.");
                      return;
                    }
                    mainHandler.postDelayed(this, 2000L);
                    return;
                  }

                  queryFailures[0] = 0;
                  int status = cursor.getInt(cursor.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS));
                  long downloaded = cursor.getLong(
                      cursor.getColumnIndexOrThrow(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR));
                  long total = cursor.getLong(
                      cursor.getColumnIndexOrThrow(DownloadManager.COLUMN_TOTAL_SIZE_BYTES));
                  long now = SystemClock.elapsedRealtime();
                  long bytesPerSecond = 0L;
                  if (previousBytes[0] >= 0L && now > previousSampleAt[0] && downloaded >= previousBytes[0]) {
                    bytesPerSecond = ((downloaded - previousBytes[0]) * 1000L) / (now - previousSampleAt[0]);
                  }
                  previousBytes[0] = downloaded;
                  previousSampleAt[0] = now;
                  long elapsedMs = Math.max(0L, now - monitorStartedAt);

                  if (status == DownloadManager.STATUS_RUNNING) {
                    notifyDownloadState(downloadId, "downloading", downloaded, total, null, null,
                        bytesPerSecond, elapsedMs);
                    nextPollDelay = 1000L;
                  } else if (status == DownloadManager.STATUS_PENDING) {
                    notifyDownloadState(downloadId, "downloading", downloaded, total, null, null,
                        0L, elapsedMs);
                    nextPollDelay = 1500L;
                  } else if (status == DownloadManager.STATUS_PAUSED) {
                    notifyDownloadState(downloadId, "paused", downloaded, total, null,
                        "Android paused this download; it will resume when the platform allows.", 0L, elapsedMs);
                    nextPollDelay = 3000L;
                  } else if (status == DownloadManager.STATUS_SUCCESSFUL) {
                    monitoredDownloads.remove(downloadId);
                    notifyDownloadState(downloadId, "verifying", downloaded, total, null, null, 0L, elapsedMs);
                    Uri apkUri = manager.getUriForDownloadedFile(downloadId);
                    if (apkUri == null || !destinationFile.isFile() || destinationFile.length() <= 0L
                        || (total > 0L && destinationFile.length() != total)
                        || (downloaded > 0L && total > 0L && downloaded != total)) {
                      failDownload(manager, downloadId, destinationFile, preferences, downloadKey, shaKey,
                          "The downloaded APK is missing, empty, or incomplete.");
                      return;
                    }
                    verifyAndFinishDownload(manager, downloadId, apkUri, destinationFile,
                        expectedSha256, expectedVersionCode, versionName, installedInfo,
                        installedVersionCode, downloadOnly, preferences, downloadKey, shaKey,
                        downloaded, total, mainHandler);
                    return;
                  } else if (status == DownloadManager.STATUS_FAILED) {
                    monitoredDownloads.remove(downloadId);
                    failDownload(manager, downloadId, destinationFile, preferences, downloadKey, shaKey,
                        "The APK download failed. Check the network and retry.");
                    return;
                  } else {
                    monitoredDownloads.remove(downloadId);
                    failDownload(manager, downloadId, destinationFile, preferences, downloadKey, shaKey,
                        "Android stopped the APK download. Please retry.");
                    return;
                  }
                } catch (Exception pollingError) {
                  if (++queryFailures[0] > 3) {
                    monitoredDownloads.remove(downloadId);
                    failDownload(manager, downloadId, destinationFile, preferences, downloadKey, shaKey,
                        "Unable to read the update download status.");
                    return;
                  }
                  nextPollDelay = 2000L;
                }
                mainHandler.postDelayed(this, nextPollDelay);
              }
            };
            // The first poll emits real DownloadManager byte counts, including resumed bytes.
            mainHandler.post(poll);
          }

          private void verifyAndFinishDownload(
              DownloadManager manager,
              long downloadId,
              Uri apkUri,
              File destinationFile,
              String expectedSha256,
              Integer expectedVersionCode,
              String versionName,
              PackageInfo installedInfo,
              long installedVersionCode,
              boolean downloadOnly,
              SharedPreferences preferences,
              String downloadKey,
              String shaKey,
              long downloadedBytes,
              long totalBytes,
              Handler mainHandler) {
            new Thread(() -> {
              try {
                String actualSha256 = sha256(apkUri);
                if (!expectedSha256.equalsIgnoreCase(actualSha256)) {
                  throw new java.io.IOException("APK checksum does not match the published update manifest.");
                }
                int packageFlags = Build.VERSION.SDK_INT >= Build.VERSION_CODES.P
                    ? PackageManager.GET_SIGNING_CERTIFICATES
                    : PackageManager.GET_SIGNATURES;
                PackageInfo downloadedInfo = getContext().getPackageManager()
                    .getPackageArchiveInfo(destinationFile.getAbsolutePath(), packageFlags);
                if (downloadedInfo == null
                    || !getContext().getPackageName().equals(downloadedInfo.packageName)) {
                  throw new java.io.IOException("Downloaded APK package name is invalid.");
                }
                long downloadedVersionCode = Build.VERSION.SDK_INT >= Build.VERSION_CODES.P
                    ? downloadedInfo.getLongVersionCode()
                    : downloadedInfo.versionCode;
                if (downloadedVersionCode != expectedVersionCode.longValue()
                    || downloadedVersionCode <= installedVersionCode) {
                  throw new java.io.IOException("Downloaded APK version does not match release metadata.");
                }
                if (!sameSigningCertificate(installedInfo, downloadedInfo)) {
                  throw new java.io.IOException("Downloaded APK signing certificate does not match the installed app.");
                }

                if (downloadOnly) {
                  String publicName = "MathApp-v" + versionName + ".apk";
                  Uri savedUri = saveVerifiedApkToDownloads(destinationFile, publicName, expectedSha256);
                  manager.remove(downloadId);
                  preferences.edit().remove(downloadKey).remove(shaKey).apply();
                  notifyDownloadState(downloadId, "saved_to_downloads", downloadedBytes,
                      totalBytes, publicName, null);
                  mainHandler.post(() -> {
                    Toast.makeText(getContext(),
                        "Verified APK saved to Downloads/" + publicName,
                        Toast.LENGTH_LONG).show();
                    showSavedApkNotification(savedUri, publicName, expectedVersionCode);
                  });
                  return;
                }

                mainHandler.post(() -> {
                  Intent install = new Intent(Intent.ACTION_VIEW);
                  install.setDataAndType(apkUri, "application/vnd.android.package-archive");
                  install.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  install.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try {
                    getContext().startActivity(install);
                    // Keep the verified completed DownloadManager item so a cancelled installer
                    // can be reopened without transferring the APK again.
                    notifyDownloadState(downloadId, "installer_opened", downloadedBytes,
                        totalBytes, null, null);
                  } catch (Exception installError) {
                    failDownload(manager, downloadId, destinationFile, preferences, downloadKey, shaKey,
                        "Unable to open Android installer.");
                  }
                });
              } catch (Exception verificationError) {
                failDownload(manager, downloadId, destinationFile, preferences, downloadKey, shaKey,
                    verificationError.getMessage() == null ? "APK verification failed." : verificationError.getMessage());
              }
            }, "MathApp-APK-verifier").start();
          }

          private void failDownload(
              DownloadManager manager,
              long downloadId,
              File destinationFile,
              SharedPreferences preferences,
              String downloadKey,
              String shaKey,
              String message) {
            monitoredDownloads.remove(downloadId);
            manager.remove(downloadId);
            preferences.edit().remove(downloadKey).remove(shaKey).apply();
            if (destinationFile.exists()) destinationFile.delete();
            notifyDownloadState(downloadId, "failed", 0L, 0L, null, message);
            new Handler(getContext().getMainLooper()).post(() ->
                Toast.makeText(getContext(), message, Toast.LENGTH_LONG).show());
          }

          private void notifyDownloadState(
              long downloadId, String state, long downloaded, long total,
              String fileName, String message) {
            notifyDownloadState(downloadId, state, downloaded, total, fileName, message, 0L, 0L);
          }

          private void notifyDownloadState(
              long downloadId, String state, long downloaded, long total,
              String fileName, String message, long bytesPerSecond, long elapsedMs) {
            JSObject data = new JSObject();
            data.put("downloadId", downloadId);
            data.put("state", state);
            data.put("progress", total > 0L
                ? Math.max(0, Math.min(100, (int) ((downloaded * 100L) / total)))
                : 0);
            data.put("downloadedBytes", Math.max(0L, downloaded));
            if (total >= 0L) data.put("totalBytes", total);
            data.put("bytesPerSecond", Math.max(0L, bytesPerSecond));
            data.put("elapsedMs", Math.max(0L, elapsedMs));
            if (fileName != null) data.put("fileName", fileName);
            if (message != null) data.put("message", message);
            notifyListeners(DOWNLOAD_EVENT, data, true);
          }
              private String sha256(Uri uri) throws Exception {
                  try (InputStream input = getContext().getContentResolver().openInputStream(uri)) {
                      if (input == null) throw new java.io.IOException("Downloaded APK cannot be read.");
                      MessageDigest digest = MessageDigest.getInstance("SHA-256");
                      byte[] buffer = new byte[64 * 1024];
                      int length;
                      while ((length = input.read(buffer)) != -1) digest.update(buffer, 0, length);
                      StringBuilder actual = new StringBuilder();
                      for (byte value : digest.digest()) actual.append(String.format(Locale.ROOT, "%02x", value));
                      return actual.toString();
                  }
              }

              private boolean sameSigningCertificate(PackageInfo installed, PackageInfo downloaded) throws Exception {
                  Set<String> installedDigests = signingDigests(installed);
                  Set<String> downloadedDigests = signingDigests(downloaded);
                  return !installedDigests.isEmpty() && installedDigests.equals(downloadedDigests);
              }

              private Set<String> signingDigests(PackageInfo info) throws Exception {
                  Signature[] signatures;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P && info.signingInfo != null) {
                      signatures = info.signingInfo.getApkContentsSigners();
                  } else {
                      signatures = info.signatures;
                  }
                  Set<String> result = new TreeSet<>();
                  if (signatures == null) return result;
                  MessageDigest digest = MessageDigest.getInstance("SHA-256");
                  for (Signature signature : signatures) {
                      byte[] value = digest.digest(signature.toByteArray());
                      StringBuilder hex = new StringBuilder();
                      for (byte b : value) hex.append(String.format(Locale.ROOT, "%02x", b));
                      result.add(hex.toString());
                  }
                  return result;
              }

              private Uri saveVerifiedApkToDownloads(File source, String displayName, String expectedSha256) throws Exception {
                  ContentResolver resolver = getContext().getContentResolver();
                  Uri savedUri;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      Uri collection = MediaStore.Downloads.EXTERNAL_CONTENT_URI;
                      String selection = MediaStore.MediaColumns.DISPLAY_NAME + "=? AND "
                          + MediaStore.MediaColumns.RELATIVE_PATH + "=?";
                      String[] args = { displayName, Environment.DIRECTORY_DOWNLOADS + "/" };
                      try (Cursor cursor = resolver.query(collection,
                          new String[] { MediaStore.MediaColumns._ID }, selection, args, null)) {
                          if (cursor != null) {
                              while (cursor.moveToNext()) {
                                  long id = cursor.getLong(0);
                                  resolver.delete(Uri.withAppendedPath(collection, Long.toString(id)), null, null);
                              }
                          }
                      }
                      ContentValues values = new ContentValues();
                      values.put(MediaStore.MediaColumns.DISPLAY_NAME, displayName);
                      values.put(MediaStore.MediaColumns.MIME_TYPE, "application/vnd.android.package-archive");
                      values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/");
                      values.put(MediaStore.MediaColumns.IS_PENDING, 1);
                      savedUri = resolver.insert(collection, values);
                      if (savedUri == null) throw new java.io.IOException("Unable to create the APK file in Downloads.");
                      try (InputStream input = new FileInputStream(source);
                           OutputStream output = resolver.openOutputStream(savedUri, "w")) {
                          if (output == null) throw new java.io.IOException("Unable to write the APK to Downloads.");
                          copy(input, output);
                      } catch (Exception e) {
                          resolver.delete(savedUri, null, null);
                          throw e;
                      }
                      ContentValues ready = new ContentValues();
                      ready.put(MediaStore.MediaColumns.IS_PENDING, 0);
                      resolver.update(savedUri, ready, null, null);
                  } else {
                      File directory = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                      if (!directory.exists() && !directory.mkdirs()) {
                          throw new java.io.IOException("Unable to create the public Downloads folder.");
                      }
                      File target = new File(directory, displayName);
                      if (target.exists() && !target.delete()) {
                          throw new java.io.IOException("Unable to replace the previous APK in Downloads.");
                      }
                      try (InputStream input = new FileInputStream(source);
                           OutputStream output = new FileOutputStream(target)) {
                          copy(input, output);
                      } catch (Exception copyError) {
                          if (target.exists()) target.delete();
                          throw copyError;
                      }
                      savedUri = Uri.fromFile(target);
                  }
                  if (!expectedSha256.equalsIgnoreCase(sha256(savedUri))) {
                      if ("file".equals(savedUri.getScheme())) {
                          File invalidFile = new File(savedUri.getPath());
                          if (invalidFile.exists()) invalidFile.delete();
                      } else {
                          resolver.delete(savedUri, null, null);
                      }
                      throw new java.io.IOException("Saved APK checksum verification failed.");
                  }
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                      savedUri = FileProvider.getUriForFile(
                          getContext(), getContext().getPackageName() + ".fileprovider",
                          new File(savedUri.getPath()));
                  }
                  return savedUri;
              }

              private void copy(InputStream input, OutputStream output) throws Exception {
                  byte[] buffer = new byte[64 * 1024];
                  int length;
                  while ((length = input.read(buffer)) != -1) output.write(buffer, 0, length);
                  output.flush();
              }

              private void showSavedApkNotification(Uri apkUri, String fileName, int versionCode) {
                  NotificationManager manager = (NotificationManager) getContext().getSystemService(Context.NOTIFICATION_SERVICE);
                  if (manager == null) return;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          UPDATE_CHANNEL_ID, "App Updates", NotificationManager.IMPORTANCE_DEFAULT);
                      channel.setDescription("Math App update download results.");
                      manager.createNotificationChannel(channel);
                  }
                  Intent openApk = new Intent(Intent.ACTION_VIEW);
                  openApk.setDataAndType(apkUri, "application/vnd.android.package-archive");
                  openApk.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                  PendingIntent contentIntent = PendingIntent.getActivity(
                      getContext(), 8800 + versionCode, openApk,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  Notification.Builder builder = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                      ? new Notification.Builder(getContext(), UPDATE_CHANNEL_ID)
                      : new Notification.Builder(getContext());
                  Notification notification = builder
                      .setSmallIcon(getContext().getApplicationInfo().icon)
                      .setContentTitle("APK saved to Downloads")
                      .setContentText("Tap to open " + fileName)
                      .setContentIntent(contentIntent)
                      .setAutoCancel(true)
                      .setOnlyAlertOnce(true)
                      .build();
                  manager.notify("mathapp-apk-saved", 8800 + versionCode, notification);
              }
          }
