          fi

          # Update the public JSON with the checksum of this exact APK.
          manifest_base64="$(base64 -w 0 dist/updates/update.json)"
          existing_sha="$(gh api "repos/${UPDATES_REPO}/contents/updates/update.json?ref=main" --jq .sha 2>/dev/null || true)"
          manifest_message="Publish MathMaster update manifest v${VERSION_NAME} (build ${VERSION_CODE})"
          if [ -n "$existing_sha" ] && [ "$existing_sha" != "null" ]; then
            gh api --method PUT "repos/${UPDATES_REPO}/contents/updates/update.json" \
              -f message="$manifest_message" -f content="$manifest_base64" -f branch=main -f sha="$existing_sha" >/dev/null
          else
            gh api --method PUT "repos/${UPDATES_REPO}/contents/updates/update.json" \
              -f message="$manifest_message" -f content="$manifest_base64" -f branch=main >/dev/null
          fi

          # Verify the public endpoint without relying on a potentially cached CDN response.
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 "https://raw.githubusercontent.com/${UPDATES_REPO}/main/updates/update.json?cacheBust=${GITHUB_SHA}" -o "$RUNNER_TEMP/published-update.json"
          EXPECTED_APK_SHA256="$(python3 -c 'import json; from pathlib import Path; print(json.loads(Path("dist/updates/update.json").read_text(encoding="utf-8"))["sha256"].lower())')"
          python3 - "$VERSION_CODE" "$VERSION_NAME" "$RUNNER_TEMP/published-update.json" "$EXPECTED_APK_SHA256" <<'PY'
          import json, sys
          with open(sys.argv[3], encoding="utf-8") as manifest_file:
              manifest = json.load(manifest_file)
          if manifest.get("packageName") != "com.sudhanshu.mathsbj":
              raise SystemExit("Published update manifest has an unexpected package name")
          if manifest.get("versionCode") != int(sys.argv[1]) or manifest.get("versionName") != sys.argv[2]:
              raise SystemExit("Published update manifest does not match this APK build")
          if manifest.get("apkUrl") != "https://github.com/sudhanshu1920/mathsbj-updates/releases/download/latest/MathMaster-release.apk":
              raise SystemExit("Published update manifest has an unexpected APK URL")
          if not isinstance(manifest.get("sha256"), str) or len(manifest["sha256"]) != 64:
              raise SystemExit("Published update manifest has an invalid APK checksum")
          if manifest["sha256"].lower() != sys.argv[4].lower():
              raise SystemExit("Published update manifest checksum does not match the signed APK built in this workflow")
          PY

      - name: Verify published APK asset SHA-256 before push
        shell: bash
        env:
          PUBLISHED_APK_URL: https://github.com/sudhanshu1920/mathsbj-updates/releases/download/latest/MathMaster-release.apk
        run: |
          set -euo pipefail
          expected_sha256="$(python3 -c 'import json, sys; from pathlib import Path; print(json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["sha256"].lower())' "$RUNNER_TEMP/published-update.json")"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            "${PUBLISHED_APK_URL}?cacheBust=${GITHUB_SHA}" \
            -o "$RUNNER_TEMP/published-mathmaster.apk"
          test -s "$RUNNER_TEMP/published-mathmaster.apk"
          actual_sha256="$(sha256sum "$RUNNER_TEMP/published-mathmaster.apk" | awk '{print $1}')"
          if [ "$actual_sha256" != "$expected_sha256" ]; then
            echo "::error::Published APK asset SHA-256 does not match the update manifest; FCM notification will not be sent."
            exit 1
          fi
          echo "Public APK asset verified against the published update manifest."

      - name: Send new-release push notification through Firebase (optional until configured)
        shell: bash
        env:
          MATHMASTER_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.MATHMASTER_FIREBASE_SERVICE_ACCOUNT_JSON }}
          MATHMASTER_FIREBASE_CLIENT_CONFIG_PATH: android/app/google-services.json
          MATHMASTER_UPDATES_TOKEN: ${{ secrets.MATHMASTER_UPDATES_TOKEN }}
          MATHMASTER_UPDATE_MANIFEST_PATH: dist/updates/update.json
        run: |
          set -euo pipefail
          if [ -z "${MATHMASTER_FIREBASE_SERVICE_ACCOUNT_JSON}" ]; then
            echo "::warning::FCM release push skipped: configure MATHMASTER_FIREBASE_SERVICE_ACCOUNT_JSON in GitHub Actions secrets."
            exit 0
          fi
          if [ ! -s "${MATHMASTER_FIREBASE_CLIENT_CONFIG_PATH}" ]; then
            echo "::warning::FCM release push skipped: configure MATHMASTER_FIREBASE_GOOGLE_SERVICES_JSON_BASE64 for the Android Firebase client."
            exit 0
          fi
          node scripts/release-notification-sender.mjs

