name: Android APK

# Production workflow builds and verifies the signed release APK directly.
run-name: Android APK #${{ github.run_number }} — ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fix/**'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[BUILD_ANDROID_APK]'))
    runs-on: ubuntu-latest

    # APK artifacts use local guest mode and do not require cloud-auth secrets.
    env:
      VITE_OFFLINE_MODE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
      - name: Release versioning unit tests
        run: node --test scripts/release-version.test.mjs

      - name: Resolve automatic release version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/release-version.mjs > "$RUNNER_TEMP/release-version.json"
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          data = json.loads(Path(os.environ["RUNNER_TEMP"] + "/release-version.json").read_text(encoding="utf-8"))
          version_code = data.get("versionCode")
          version_name = data.get("versionName")
          if not isinstance(version_code, int) or version_code < 1 or version_code > 2100000000:
              raise SystemExit("Resolved Android versionCode is invalid")
          if not isinstance(version_name, str) or not re.fullmatch(r"\d+\.\d+\.\d+", version_name):
              raise SystemExit("Resolved Android versionName must be semantic X.Y.Z")
          if data.get("sourceCommit") != os.environ["GITHUB_SHA"].lower():
              raise SystemExit("Resolved version is not associated with the checked-out source commit")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"VERSION_CODE={version_code}\n")
              env_file.write(f"VERSION_NAME={version_name}\n")
              env_file.write(f"VITE_APP_VERSION_CODE={version_code}\n")
              env_file.write(f"VITE_APP_VERSION_NAME={version_name}\n")
          print(f"Resolved release version: {version_name} (versionCode {version_code})")
          PY
      - name: Build web assets
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Register native immersive game mode
        shell: bash
        run: |
          set -euo pipefail
          plugin_dir="android/app/src/main/java/com/sudhanshu/mathsbj"
          mkdir -p "$plugin_dir"
          cat > "$plugin_dir/ImmersiveModePlugin.java" <<'JAVA'
          package com.sudhanshu.mathsbj;

          import android.os.Build;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;

          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "ImmersiveMode")
          public class ImmersiveModePlugin extends Plugin {
              @PluginMethod
              public void enter(PluginCall call) { setImmersive(true, call); }

              @PluginMethod
              public void exit(PluginCall call) { setImmersive(false, call); }

              private void setImmersive(boolean enabled, PluginCall call) {
                  getActivity().runOnUiThread(() -> {
                      Window window = getActivity().getWindow();
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          WindowInsetsController controller = window.getInsetsController();
                          if (controller != null) {
                              int bars = WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars();
                              if (enabled) {
                                  controller.hide(bars);
                                  controller.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                              } else {
                                  controller.show(bars);
                                  controller.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_DEFAULT);
                              }
                          }
                          window.setDecorFitsSystemWindows(false);
                      } else {
                          int flags = View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION;
                          if (enabled) flags |= View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION;
                          window.getDecorView().setSystemUiVisibility(flags);
                      }
                      call.resolve();
                  });
              }
          }
          JAVA
          cat > "$plugin_dir/MainActivity.java" <<'JAVA'
          package com.sudhanshu.mathsbj;

          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ImmersiveModePlugin.class);
                  super.onCreate(savedInstanceState);
                  Window window = getWindow();
                  window.setStatusBarColor(Color.TRANSPARENT);
                  window.setNavigationBarColor(Color.TRANSPARENT);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      window.setNavigationBarContrastEnforced(false);
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.setDecorFitsSystemWindows(false);
                  } else {
                      window.getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      );
                  }
              }
          }
          JAVA
          grep -q 'name = "ImmersiveMode"' "$plugin_dir/ImmersiveModePlugin.java"
          grep -q 'ImmersiveModePlugin.class' "$plugin_dir/MainActivity.java"

      - name: Configure Android application identity and version
        shell: bash
        env:
          EXPECTED_APPLICATION_ID: "com.sudhanshu.mathsbj"
        run: |
          set -euo pipefail
          VERSION_CODE="${VERSION_CODE:?Missing resolved versionCode}"
          VERSION_NAME="${VERSION_NAME:?Missing resolved versionName}"
          export VERSION_CODE VERSION_NAME
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          path = Path("android/app/build.gradle")
          lines = path.read_text(encoding="utf-8").splitlines()
          expected_id = os.environ["EXPECTED_APPLICATION_ID"]
          version_code = int(os.environ["VERSION_CODE"])
          version_name = os.environ["VERSION_NAME"]
          if version_code < 1 or version_code > 2100000000:
              raise SystemExit("Android versionCode is out of range")
          if not re.fullmatch(r"\d+\.\d+\.\d+", version_name):
              raise SystemExit("Android versionName must be semantic X.Y.Z")
          if not any(line.strip() == f'applicationId "{expected_id}"' for line in lines):
              raise SystemExit(f"Production applicationId mismatch; expected {expected_id}")
          if not any(line.strip().startswith("namespace ") for line in lines):
              raise SystemExit("Android namespace is missing")
          code_updated = name_updated = False
          for i, line in enumerate(lines):
              stripped = line.strip()
              indent = line[:len(line) - len(line.lstrip())]
              if stripped.startswith("versionCode ") and not code_updated:
                  lines[i] = f"{indent}versionCode {version_code}"
                  code_updated = True
              elif stripped.startswith("versionName ") and not name_updated:
                  lines[i] = f'{indent}versionName "{version_name}"'
                  name_updated = True
          if not code_updated: raise SystemExit("versionCode declaration not found")
          if not name_updated: raise SystemExit("versionName declaration not found")
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure production release signing
        shell: bash
        env:
          MATHMASTER_RELEASE_KEYSTORE_BASE64: ${{ secrets.MATHMASTER_RELEASE_KEYSTORE_BASE64 }}
          MATHMASTER_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.MATHMASTER_RELEASE_KEYSTORE_PASSWORD }}
          MATHMASTER_RELEASE_KEY_ALIAS: ${{ secrets.MATHMASTER_RELEASE_KEY_ALIAS }}
          MATHMASTER_RELEASE_KEY_PASSWORD: ${{ secrets.MATHMASTER_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in MATHMASTER_RELEASE_KEYSTORE_BASE64 MATHMASTER_RELEASE_KEYSTORE_PASSWORD MATHMASTER_RELEASE_KEY_ALIAS MATHMASTER_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required production signing secret: ${name}"
              echo "::error::The original signing key is required for direct APK updates over the installed app."
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/math-master-production-release.jks"
          printf '%s' "$MATHMASTER_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"

          keytool -list -v \
            -keystore "$keystore" \
            -storepass "$MATHMASTER_RELEASE_KEYSTORE_PASSWORD" \
            -alias "$MATHMASTER_RELEASE_KEY_ALIAS" >/dev/null

          {
            echo "MATHMASTER_RELEASE_KEYSTORE_PATH=$keystore"
            echo "MATHMASTER_RELEASE_KEYSTORE_PASSWORD=$MATHMASTER_RELEASE_KEYSTORE_PASSWORD"
            echo "MATHMASTER_RELEASE_KEY_ALIAS=$MATHMASTER_RELEASE_KEY_ALIAS"
            echo "MATHMASTER_RELEASE_KEY_PASSWORD=$MATHMASTER_RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text(encoding="utf-8")

          marker = "android {"
          signing = """android {
              signingConfigs {
                  productionRelease {
                      storeFile file(System.getenv("MATHMASTER_RELEASE_KEYSTORE_PATH"))
                      storePassword System.getenv("MATHMASTER_RELEASE_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("MATHMASTER_RELEASE_KEY_ALIAS")
                      keyPassword System.getenv("MATHMASTER_RELEASE_KEY_PASSWORD")
                  }
              }
          """

          if text.count(marker) != 1:
              raise SystemExit("Expected exactly one android { block")

          if "signingConfigs {" not in text:
              text = text.replace(marker, signing, 1)
          elif "productionRelease" not in text:
              raise SystemExit("Existing signingConfigs block is present but productionRelease is missing")

          target = "buildTypes {\n        release {"
          replacement = """buildTypes {
                  release {
                      signingConfig signingConfigs.productionRelease"""
          if target not in text:
              raise SystemExit("Expected release buildTypes block not found")

          text = text.replace(target, replacement, 1)
          path.write_text(text, encoding="utf-8")
          PY

          grep -q "signingConfigs.productionRelease" android/app/build.gradle

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK identity, version, signature and installability
        shell: bash
        env:
          EXPECTED_APPLICATION_ID: "com.sudhanshu.mathsbj"
          EXPECTED_RELEASE_CERT_SHA256: "681A1EEB65E63DB5CCDF01748A27AA0045033E5C3C5D0C29ED16EE0D35769B64"
        run: |
          set -euo pipefail
          EXPECTED_VERSION_CODE="${VERSION_CODE:?Missing resolved versionCode}"
          EXPECTED_VERSION_NAME="${VERSION_NAME:?Missing resolved versionName}"
          export EXPECTED_VERSION_CODE

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT2="$BUILD_TOOLS/aapt2"
          test -x "$APKSIGNER"
          test -x "$AAPT2"

          apk="$(find android/app/build/outputs/apk/release -type f -name '*release*.apk' | head -n 1)"
          test -n "$apk"

          "$APKSIGNER" verify --verbose "$apk"

          badging="$("$AAPT2" dump badging "$apk")"
          echo "$badging" | grep -q "package: name='$EXPECTED_APPLICATION_ID' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'"

          expected_fp="$(
            keytool -exportcert -rfc \
              -keystore "$MATHMASTER_RELEASE_KEYSTORE_PATH" \
              -storepass "$MATHMASTER_RELEASE_KEYSTORE_PASSWORD" \
              -alias "$MATHMASTER_RELEASE_KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 |
            sed 's/.*=//' | tr -d ':' | tr '[:lower:]' '[:upper:]'
          )"

          certificate_output="$("$APKSIGNER" verify --print-certs "$apk" 2>&1)"
          actual_fp="$(
            printf '%s\n' "$certificate_output" |
            grep -i 'certificate SHA-256 digest' |
            grep -Eo '[[:xdigit:]]{64}' |
            head -n 1 |
            tr '[:lower:]' '[:upper:]' || true
          )"

          printf 'Signing keystore certificate SHA-256: %s\n' "$expected_fp"
          printf 'Built APK signer SHA-256: %s\n' "$actual_fp"
          printf 'Pinned production certificate SHA-256: %s\n' "$EXPECTED_RELEASE_CERT_SHA256"

          if [[ -z "$expected_fp" || -z "$actual_fp" ]]; then
            echo "::error::Could not extract the release signing certificate fingerprint."
            exit 1
          fi
          if [[ "$expected_fp" != "$actual_fp" ]]; then
            echo "::error::The APK was not signed by the certificate in the configured release keystore."
            exit 1
          fi
          if [[ "$actual_fp" != "$EXPECTED_RELEASE_CERT_SHA256" ]]; then
            echo "::error::The configured release certificate does not match the pinned production certificate used by existing MathMaster installations."
            exit 1
          fi

          sha256sum "$apk"
          ls -lh "$apk"
          rm -f "$MATHMASTER_RELEASE_KEYSTORE_PATH"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: math-master-android-release
          path: android/app/build/outputs/apk/release/*release*.apk
          if-no-files-found: error
          retention-days: 14
