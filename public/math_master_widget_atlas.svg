<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="512" viewBox="0 0 1536 512">
  <title>Math Master premium widget artwork atlas</title>
  <desc>Six vivid, text-free vector scenes for adaptive Android home-screen widgets.</desc>
  <defs>
    <linearGradient id="sunset" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#182c62"/><stop offset=".48" stop-color="#f48f9d"/><stop offset="1" stop-color="#ffcf8c"/>
    </linearGradient>
    <linearGradient id="forest" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#062e39"/><stop offset=".5" stop-color="#08765f"/><stop offset="1" stop-color="#b2d878"/>
    </linearGradient>
    <linearGradient id="robotSky" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071a4a"/><stop offset=".6" stop-color="#063d83"/><stop offset="1" stop-color="#1599d1"/>
    </linearGradient>
    <linearGradient id="roseSky" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffd3e7"/><stop offset=".55" stop-color="#e8a3cd"/><stop offset="1" stop-color="#986bb7"/>
    </linearGradient>
    <linearGradient id="cosmos" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#060d31"/><stop offset=".52" stop-color="#27216e"/><stop offset="1" stop-color="#0a688f"/>
    </linearGradient>
    <linearGradient id="lakeSky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#163b64"/><stop offset=".48" stop-color="#35b5b3"/><stop offset="1" stop-color="#f5c78c"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#35d0cb" stop-opacity=".9"/><stop offset="1" stop-color="#082d53"/>
    </linearGradient>
    <linearGradient id="goldBook" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffd984"/><stop offset="1" stop-color="#e57d35"/>
    </linearGradient>
    <linearGradient id="blueBook" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#66dcf1"/><stop offset="1" stop-color="#2365b2"/>
    </linearGradient>
    <linearGradient id="botShell" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffef5"/><stop offset=".55" stop-color="#bedff3"/><stop offset="1" stop-color="#6098c8"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop stop-color="#fff9cc" stop-opacity=".95"/><stop offset="1" stop-color="#ffd36c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula">
      <stop stop-color="#d35dff" stop-opacity=".76"/><stop offset=".48" stop-color="#7958ff" stop-opacity=".32"/><stop offset="1" stop-color="#2a3cc0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet">
      <stop stop-color="#b3f2ff"/><stop offset=".45" stop-color="#538fe8"/><stop offset="1" stop-color="#343b9a"/>
    </radialGradient>
    <pattern id="stars" width="73" height="61" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="12" r="1.3" fill="#fff" opacity=".75"/>
      <circle cx="54" cy="38" r="1" fill="#7ee9ff" opacity=".8"/>
      <path d="M34 6v5M31.5 8.5h5" stroke="#fff" stroke-width="1" opacity=".62"/>
    </pattern>
    <clipPath id="panel"><rect x="0" y="0" width="512" height="256" rx="0"/></clipPath>
  </defs>

