name: Android Release APK

on:
  push:
    branches:
      - apk-production-build
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    # APK creation is explicit: manual dispatch, or a commit explicitly marked
    # with [BUILD_APK]. Normal source/UI changes never produce an APK.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[BUILD_APK]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Native Android build is generated from the checked-in web source.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript / lint validation
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Prepare supplied SBJ app logo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          base64 -d public/app-icon.b64 > /tmp/sbj-logo.jpg
          test -s /tmp/sbj-logo.jpg
          identify /tmp/sbj-logo.jpg
          convert /tmp/sbj-logo.jpg -auto-orient -resize 1024x1024^ -gravity center -extent 1024x1024 public/app-icon.png
          identify -format '%wx%h' public/app-icon.png | grep -qx '1024x1024'
          test -s public/app-icon.png

      - name: Build web application
        run: npm run build

      - name: Install Capacitor Android build tooling
        run: npm install --no-save @capacitor/cli@8.5.2 @capacitor/android@8.5.2

      - name: Generate Android project from repository source
        run: npx cap add android

      - name: Configure Android edge-to-edge system bars
        shell: bash
        run: |
          set -euo pipefail
          main_activity="android/app/src/main/java/com/sudhanshu/mathsbj/MainActivity.java"
          test -f "$main_activity"
          cat > "$main_activity" <<'JAVA'
          package com.sudhanshu.mathsbj;

          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();
                  window.setStatusBarColor(Color.TRANSPARENT);
                  window.setNavigationBarColor(Color.TRANSPARENT);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      window.setNavigationBarContrastEnforced(false);
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.setDecorFitsSystemWindows(false);
                  } else {
                      window.getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      );
                  }
              }
          }
          JAVA

          grep -q "setDecorFitsSystemWindows(false)" "$main_activity"
          grep -q "setNavigationBarColor(Color.TRANSPARENT)" "$main_activity"

      - name: Sync web build into Android project
        run: npx cap sync android

      - name: Generate Android launcher icon from supplied SBJ logo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p resources
          cp public/app-icon.png resources/icon.png
          test -s resources/icon.png
          npx --yes @capacitor/assets@3.0.5 generate --android
        env:
          CI: "true"

      - name: Configure CI release signing
        shell: bash
        run: |
          set -euo pipefail

          key_password="$(openssl rand -hex 24)"
          store_password="$(openssl rand -hex 24)"
          keystore="$GITHUB_WORKSPACE/android/app/ci-release.keystore"

          keytool -genkeypair -v \
            -storetype JKS \
            -keystore "$keystore" \
            -storepass "$store_password" \
            -keypass "$key_password" \
            -alias "MathMasterCI" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Math Master CI,O=SBJ Sigma,C=IN"

          {
            echo "CI_KEYSTORE_PATH=$keystore"
            echo "CI_KEYSTORE_PASSWORD=$store_password"
            echo "CI_KEY_PASSWORD=$key_password"
          } >> "$GITHUB_ENV"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text(encoding="utf-8")

          marker = "android {"
          signing = """android {
              signingConfigs {
                  ciRelease {
                      storeFile file(System.getenv("CI_KEYSTORE_PATH"))
                      storePassword System.getenv("CI_KEYSTORE_PASSWORD")
                      keyAlias "MathMasterCI"
                      keyPassword System.getenv("CI_KEY_PASSWORD")
                  }
              }
          """

          if text.count(marker) != 1:
              raise SystemExit("Expected exactly one android { block")

          if "signingConfigs {" not in text:
              text = text.replace(marker, signing, 1)

          target = "buildTypes {\n        release {"
          replacement = """buildTypes {
                  release {
                      signingConfig signingConfigs.ciRelease"""
          if target not in text:
              raise SystemExit("Expected release buildTypes block not found")

          text = text.replace(target, replacement, 1)
          path.write_text(text, encoding="utf-8")
          PY

          test -s "$keystore"
          echo "CI release signing configured"

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK is signed and installable
        shell: bash
        run: |
          set -euo pipefail

          sdk_apksigner="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          if [ ! -x "$sdk_apksigner" ]; then
            sdk_apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          fi
          test -x "$sdk_apksigner"

          apk="$(find android/app/build/outputs/apk/release -type f -name '*release*.apk' | head -n 1)"
          test -n "$apk"

          "$sdk_apksigner" verify --verbose "$apk"

      - name: Collect release APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/release -type f -name '*release*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" MathMaster-release.apk
          ls -lh MathMaster-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: MathMaster-release
          path: MathMaster-release.apk
          if-no-files-found: error
          retention-days: 14
# Production APK build approved explicitly by user.
