name: Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # Validate the same no-login mode shipped in Android releases.
    env:
      VITE_OFFLINE_MODE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Architecture regression checks
        run: npm run regression:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test


      - name: Build web assets
        run: npm run build

      - name: Set up Java 21 for native Android verification
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Capacitor Android build tooling
        run: npm install --no-save @capacitor/cli@8.5.2 @capacitor/android@8.5.2

      - name: Generate Android project for native smoke test
        run: npx cap add android

      - name: Prepare updater plugin registration for native smoke test
        shell: bash
        run: |
          set -euo pipefail
          plugin_dir="android/app/src/main/java/com/sudhanshu/mathsbj"
          mkdir -p "$plugin_dir"
          cat > "$plugin_dir/AppUpdaterPlugin.java" <<'JAVA'
          package com.sudhanshu.mathsbj;

          import com.getcapacitor.Plugin;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "AppUpdater")
          public class AppUpdaterPlugin extends Plugin {}
          JAVA
          cat > "$plugin_dir/ImmersiveModePlugin.java" <<'JAVA'
          package com.sudhanshu.mathsbj;

          import android.os.Build;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;

          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "ImmersiveMode")
          public class ImmersiveModePlugin extends Plugin {
              @PluginMethod
              public void enter(PluginCall call) {
                  setImmersive(true, call);
              }

              @PluginMethod
              public void exit(PluginCall call) {
                  setImmersive(false, call);
              }

              private void setImmersive(boolean enabled, PluginCall call) {
                  getActivity().runOnUiThread(() -> {
                      Window window = getActivity().getWindow();
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          WindowInsetsController controller = window.getInsetsController();
                          if (controller != null) {
                              int systemBars = WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars();
                              if (enabled) {
                                  controller.hide(systemBars);
                                  controller.setSystemBarsBehavior(
                                      WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                                  );
                              } else {
                                  controller.show(systemBars);
                                  controller.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_DEFAULT);
                              }
                          }
                          // The app uses edge-to-edge outside gameplay too; keep that base layout intact.
                          window.setDecorFitsSystemWindows(false);
                      } else {
                          int flags = View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION;
                          if (enabled) {
                              flags |= View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                  | View.SYSTEM_UI_FLAG_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION;
                          }
                          window.getDecorView().setSystemUiVisibility(flags);
                      }
                      call.resolve();
                  });
              }
          }
          JAVA
          cat > "$plugin_dir/MainActivity.java" <<'JAVA'
          package com.sudhanshu.mathsbj;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AppUpdaterPlugin.class);
                  registerPlugin(ImmersiveModePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

      - name: Configure native notifications
        run: node scripts/configure-android-notifications.mjs

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Compile native Android debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: math-master-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
