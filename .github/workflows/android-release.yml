name: Android Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[BUILD_APK]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Release versioning unit tests
        run: node --test scripts/release-version.test.mjs

      - name: Architecture regression checks
        run: npm run regression:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Resolve automatic release version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release-version.mjs > "$RUNNER_TEMP/release-version.json"
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          data = json.loads(Path(os.environ["RUNNER_TEMP"] + "/release-version.json").read_text(encoding="utf-8"))
          version_code = data.get("versionCode")
          version_name = data.get("versionName")
          source_commit = data.get("sourceCommit")
          current_commit = os.environ["GITHUB_SHA"].lower()
          if not isinstance(version_code, int) or version_code < 1 or version_code > 2100000000:
              raise SystemExit("Resolved Android versionCode is invalid")
          if not isinstance(version_name, str) or not re.fullmatch(r"\d+\.\d+\.\d+", version_name):
              raise SystemExit("Resolved Android versionName must be semantic X.Y.Z")
          if source_commit != current_commit:
              raise SystemExit("Resolved version is not associated with the checked-out source commit")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"VERSION_CODE={version_code}\n")
              env_file.write(f"VERSION_NAME={version_name}\n")
              env_file.write(f"VITE_APP_VERSION_CODE={version_code}\n")
              env_file.write(f"VITE_APP_VERSION_NAME={version_name}\n")
          print(f"Resolved release version: {version_name} (versionCode {version_code})")
          PY
      - name: Prepare supplied SBJ app logo
        shell: bash
        run: |
          set -euo pipefail
          test -s public/app-icon.svg
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick librsvg2-bin
          convert -background none public/app-icon.svg -resize 1024x1024 public/app-icon.png
          identify -format '%wx%h' public/app-icon.png | grep -qx '1024x1024'
          test -s public/app-icon.png

      - name: Build web application
        run: npm run build

      - name: Install Capacitor Android build tooling
        run: npm install --no-save @capacitor/cli@8.5.2 @capacitor/android@8.5.2

      - name: Generate Android project from repository source
        run: npx cap add android

      - name: Configure Android application identity and version
        shell: bash
        env:
          EXPECTED_APPLICATION_ID: "com.sudhanshu.mathsbj"
        run: |
          set -euo pipefail
          VERSION_CODE="${VERSION_CODE:?Missing resolved versionCode}"
          VERSION_NAME="${VERSION_NAME:?Missing resolved versionName}"
          export VERSION_CODE VERSION_NAME
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("android/app/build.gradle")
          lines = path.read_text(encoding="utf-8").splitlines()
          expected_id = os.environ["EXPECTED_APPLICATION_ID"]
          version_code = int(os.environ["VERSION_CODE"])
          version_name = os.environ["VERSION_NAME"]
          if version_code < 1 or version_code > 2100000000:
              raise SystemExit("Android versionCode is out of range")
          if not re.fullmatch(r"\d+\.\d+\.\d+", version_name):
              raise SystemExit("Android versionName must be semantic X.Y.Z")

          app_id_ok = any(line.strip() == f'applicationId "{expected_id}"' for line in lines)
          namespace_ok = any(line.strip().startswith("namespace ") for line in lines)
          if not app_id_ok:
              raise SystemExit(f"Production applicationId mismatch; expected {expected_id}")
          if not namespace_ok:
              raise SystemExit("Android namespace is missing")

          code_updated = False
          name_updated = False
          for i, line in enumerate(lines):
              stripped = line.strip()
              indent = line[:len(line) - len(line.lstrip())]
              if stripped.startswith("versionCode ") and not code_updated:
                  lines[i] = f"{indent}versionCode {version_code}"
                  code_updated = True
              elif stripped.startswith("versionName ") and not name_updated:
                  lines[i] = f'{indent}versionName "{version_name}"'
                  name_updated = True

          if not code_updated:
              raise SystemExit("versionCode declaration not found")
          if not name_updated:
              raise SystemExit("versionName declaration not found")

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Add native Android in-app updater
        shell: bash
        run: |
          set -euo pipefail

          plugin_dir="android/app/src/main/java/com/sudhanshu/mathsbj"
          mkdir -p "$plugin_dir"

          cat > "$plugin_dir/AppUpdaterPlugin.java" <<'JAVA'
          package com.sudhanshu.mathsbj;

          import android.app.DownloadManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageInfo;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.Settings;
          import android.widget.Toast;
          import java.io.InputStream;
          import java.security.MessageDigest;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "AppUpdater")
          public class AppUpdaterPlugin extends Plugin {
              @PluginMethod
              public void getVersion(PluginCall call) {
                  try {
                      PackageInfo info = getContext().getPackageManager().getPackageInfo(getContext().getPackageName(), 0);
                      long versionCode = Build.VERSION.SDK_INT >= Build.VERSION_CODES.P
                          ? info.getLongVersionCode()
                          : info.versionCode;

                      JSObject result = new JSObject();
                      result.put("versionCode", versionCode);
                      result.put("versionName", info.versionName);
                      call.resolve(result);
                  } catch (Exception e) {
                      call.reject("Unable to read app version.", e);
                  }
              }

              @PluginMethod
              public void downloadAndInstall(PluginCall call) {
                  String url = call.getString("url");
                  Uri updateUri = url == null ? null : Uri.parse(url);
                  String expectedSha256 = call.getString("sha256");
                  if (updateUri == null
                      || !"https".equalsIgnoreCase(updateUri.getScheme())
                      || !"sudhanshu1920.github.io".equalsIgnoreCase(updateUri.getHost())
                      || !"/mathsbj/updates/MathMaster-release.apk".equals(updateUri.getPath())
                      || updateUri.getQuery() != null
                      || updateUri.getFragment() != null
                      || expectedSha256 == null
                      || !expectedSha256.matches("(?i)[a-f0-9]{64}")) {
                      call.reject("Update APK source is not trusted.");
                      return;
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                      && !getContext().getPackageManager().canRequestPackageInstalls()) {
                      Intent settings = new Intent(
                          Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                          Uri.parse("package:" + getContext().getPackageName())
                      );
                      getActivity().startActivity(settings);
                      call.reject("INSTALL_PERMISSION_REQUIRED");
                      return;
                  }

                  try {
                      DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                      request.setTitle("MathMaster update");
                      request.setDescription("Downloading the latest MathMaster APK");
                      request.setMimeType("application/octet-stream");
                      request.setNotificationVisibility(
                          DownloadManager.Request.VISIBILITY_VISIBLE
                      );
                      request.setDestinationInExternalFilesDir(
                          getContext(),
                          Environment.DIRECTORY_DOWNLOADS,
                          "MathMaster-update.apk"
                      );

                      DownloadManager manager =
                          (DownloadManager) getContext().getSystemService(Context.DOWNLOAD_SERVICE);
                      long downloadId = manager.enqueue(request);

                      new android.os.Handler(getContext().getMainLooper()).post(new Runnable() {
                          private int attempts = 0;

                          @Override
                          public void run() {
                              DownloadManager.Query query =
                                  new DownloadManager.Query().setFilterById(downloadId);
                              try (android.database.Cursor cursor = manager.query(query)) {
                                  if (cursor != null && cursor.moveToFirst()) {
                                      int status = cursor.getInt(
                                          cursor.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS)
                                      );

                                      if (status == DownloadManager.STATUS_SUCCESSFUL) {
                                          Uri apkUri = manager.getUriForDownloadedFile(downloadId);
                                          if (apkUri != null) {
                                              StringBuilder actualSha256 = new StringBuilder();
                                              try (InputStream input = getContext().getContentResolver().openInputStream(apkUri)) {
                                                  if (input == null) {
                                                      manager.remove(downloadId);
                                                      Toast.makeText(getContext(), "Update verification failed.", Toast.LENGTH_LONG).show();
                                                      return;
                                                  }
                                                  MessageDigest digest = MessageDigest.getInstance("SHA-256");
                                                  byte[] buffer = new byte[8192];
                                                  int length;
                                                  while ((length = input.read(buffer)) != -1) digest.update(buffer, 0, length);
                                                  for (byte value : digest.digest()) actualSha256.append(String.format(java.util.Locale.ROOT, "%02x", value));
                                              } catch (Exception verificationError) {
                                                  manager.remove(downloadId);
                                                  Toast.makeText(getContext(), "Update verification failed.", Toast.LENGTH_LONG).show();
                                                  return;
                                              }
                                              if (!expectedSha256.equalsIgnoreCase(actualSha256.toString())) {
                                                  manager.remove(downloadId);
                                                  Toast.makeText(getContext(), "Update verification failed.", Toast.LENGTH_LONG).show();
                                                  return;
                                              }
                                              Intent install = new Intent(Intent.ACTION_VIEW);
                                              install.setDataAndType(apkUri, "application/vnd.android.package-archive");
                                              install.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                                              install.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                              getContext().startActivity(install);
                                              return;
                                          }
                                      } else if (status == DownloadManager.STATUS_FAILED) {
                                          manager.remove(downloadId);
                                          Toast.makeText(getContext(), "Update download failed.", Toast.LENGTH_LONG).show();
                                          return;
                                      } else if (attempts++ > 600) {
                                          manager.remove(downloadId);
                                          Toast.makeText(getContext(), "Update download timed out.", Toast.LENGTH_LONG).show();
                                          return;
                                      }
                                  }
                              }
                              new android.os.Handler(getContext().getMainLooper()).postDelayed(this, 1000);
                          }
                      });

                      JSObject result = new JSObject();
                      result.put("downloadId", downloadId);
                      call.resolve(result);
                  } catch (Exception e) {
                      call.reject("Unable to download the update APK.", e);
                  }
              }
          }
          JAVA

          manifest="android/app/src/main/AndroidManifest.xml"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")
          permission = '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'

          # Capacitor-generated manifests can omit the android namespace on the
          # root element. Ensure the permission we add is always namespace-valid.
          manifest_start = text.find("<manifest")
          manifest_end = text.find(">", manifest_start)
          if manifest_start < 0 or manifest_end < 0:
              raise SystemExit("AndroidManifest.xml has no valid <manifest> root element")

          root = text[manifest_start:manifest_end + 1]
          if "xmlns:android=" not in root:
              root = root[:-1] + ' xmlns:android="http://schemas.android.com/apk/res/android">'
              text = text[:manifest_start] + root + text[manifest_end + 1:]
              manifest_end = manifest_start + len(root) - 1

          if 'xmlns:android="http://schemas.android.com/apk/res/android"' not in root:
              raise SystemExit("Android namespace is missing from <manifest> root")

          if permission not in text:
              insert_at = manifest_end + 1
              text = text[:insert_at] + "\n" + permission + text[insert_at:]

          path.write_text(text, encoding="utf-8")
          PY

          grep -q "REQUEST_INSTALL_PACKAGES" "$manifest"
          grep -q 'CapacitorPlugin.*AppUpdater' "$plugin_dir/AppUpdaterPlugin.java"

      - name: Configure Android edge-to-edge system bars
        shell: bash
        run: |
          set -euo pipefail
          main_activity="android/app/src/main/java/com/sudhanshu/mathsbj/MainActivity.java"
          test -f "$main_activity"
          cat > "$main_activity" <<'JAVA'
          package com.sudhanshu.mathsbj;

          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AppUpdaterPlugin.class);
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();
                  window.setStatusBarColor(Color.TRANSPARENT);
                  window.setNavigationBarColor(Color.TRANSPARENT);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      window.setNavigationBarContrastEnforced(false);
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.setDecorFitsSystemWindows(false);
                  } else {
                      window.getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      );
                  }
              }
          }
          JAVA

          grep -q "AppUpdaterPlugin.class" "$main_activity"
          grep -q "setDecorFitsSystemWindows(false)" "$main_activity"
          grep -q "setNavigationBarColor(Color.TRANSPARENT)" "$main_activity"

      - name: Sync web build into Android project
        run: npx cap sync android

      - name: Generate Android launcher icon from supplied SBJ logo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p resources
          cp public/app-icon.png resources/icon.png
          test -s resources/icon.png
          npx --yes @capacitor/assets@3.0.5 generate --android
        env:
          CI: "true"

      - name: Apply exact supplied logo to Android launcher icons
        shell: bash
        run: |
          set -euo pipefail
          test -s public/app-icon.png

          declare -A sizes=(
            [mdpi]=48
            [hdpi]=72
            [xhdpi]=96
            [xxhdpi]=144
            [xxxhdpi]=192
          )

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir="android/app/src/main/res/mipmap-${density}"
            test -d "$dir"
            size="${sizes[$density]}"
            rsvg-convert -w "$size" -h "$size" public/app-icon.svg -o "$dir/ic_launcher.png"
            rsvg-convert -w "$size" -h "$size" public/app-icon.svg -o "$dir/ic_launcher_round.png"
            test -s "$dir/ic_launcher.png"
            test -s "$dir/ic_launcher_round.png"
          done

          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Configure production release signing
        shell: bash
        env:
          MATHMASTER_RELEASE_KEYSTORE_BASE64: ${{ secrets.MATHMASTER_RELEASE_KEYSTORE_BASE64 }}
          MATHMASTER_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.MATHMASTER_RELEASE_KEYSTORE_PASSWORD }}
          MATHMASTER_RELEASE_KEY_ALIAS: ${{ secrets.MATHMASTER_RELEASE_KEY_ALIAS }}
          MATHMASTER_RELEASE_KEY_PASSWORD: ${{ secrets.MATHMASTER_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in MATHMASTER_RELEASE_KEYSTORE_BASE64 MATHMASTER_RELEASE_KEYSTORE_PASSWORD MATHMASTER_RELEASE_KEY_ALIAS MATHMASTER_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required production signing secret: ${name}"
              echo "::error::The original signing key is required for direct APK updates over the installed app."
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/math-master-production-release.jks"
          printf '%s' "$MATHMASTER_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"

          keytool -list -v             -keystore "$keystore"             -storepass "$MATHMASTER_RELEASE_KEYSTORE_PASSWORD"             -alias "$MATHMASTER_RELEASE_KEY_ALIAS" >/dev/null

          {
            echo "MATHMASTER_RELEASE_KEYSTORE_PATH=$keystore"
            echo "MATHMASTER_RELEASE_KEYSTORE_PASSWORD=$MATHMASTER_RELEASE_KEYSTORE_PASSWORD"
            echo "MATHMASTER_RELEASE_KEY_ALIAS=$MATHMASTER_RELEASE_KEY_ALIAS"
            echo "MATHMASTER_RELEASE_KEY_PASSWORD=$MATHMASTER_RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text(encoding="utf-8")

          marker = "android {"
          signing = """android {
              signingConfigs {
                  productionRelease {
                      storeFile file(System.getenv("MATHMASTER_RELEASE_KEYSTORE_PATH"))
                      storePassword System.getenv("MATHMASTER_RELEASE_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("MATHMASTER_RELEASE_KEY_ALIAS")
                      keyPassword System.getenv("MATHMASTER_RELEASE_KEY_PASSWORD")
                  }
              }
          """

          if text.count(marker) != 1:
              raise SystemExit("Expected exactly one android { block")

          if "signingConfigs {" not in text:
              text = text.replace(marker, signing, 1)
          elif "productionRelease" not in text:
              raise SystemExit("Existing signingConfigs block is present but productionRelease is missing")

          target = "buildTypes {\n        release {"
          replacement = """buildTypes {
                  release {
                      signingConfig signingConfigs.productionRelease"""
          if target not in text:
              raise SystemExit("Expected release buildTypes block not found")

          text = text.replace(target, replacement, 1)
          path.write_text(text, encoding="utf-8")
          PY

          grep -q "signingConfigs.productionRelease" android/app/build.gradle

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK identity, version, signature and installability
        shell: bash
        env:
          EXPECTED_APPLICATION_ID: "com.sudhanshu.mathsbj"
          EXPECTED_RELEASE_CERT_SHA256: "681A1EEB65E63DB5CCDF01748A27AA0045033E5C3C5D0C29ED16EE0D35769B64"
        run: |
          set -euo pipefail
          EXPECTED_VERSION_CODE="${VERSION_CODE:?Missing resolved versionCode}"
          EXPECTED_VERSION_NAME="${VERSION_NAME:?Missing resolved versionName}"

          sdk_apksigner="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          if [ ! -x "$sdk_apksigner" ]; then
            sdk_apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          fi
          test -x "$sdk_apksigner"

          apk="$(find android/app/build/outputs/apk/release -type f -name '*release*.apk' | head -n 1)"
          test -n "$apk"

          "$sdk_apksigner" verify --verbose "$apk"

          aapt2_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          test -x "$aapt2_bin"
          badging="$("$aapt2_bin" dump badging "$apk")"
          echo "$badging" | grep -q "package: name='$EXPECTED_APPLICATION_ID' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'"

          expected_fp="$(
            keytool -exportcert -rfc               -keystore "$MATHMASTER_RELEASE_KEYSTORE_PATH"               -storepass "$MATHMASTER_RELEASE_KEYSTORE_PASSWORD"               -alias "$MATHMASTER_RELEASE_KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 |
            sed 's/.*=//' | tr -d ':' | tr '[:lower:]' '[:upper:]'
          )"

          actual_fp="$(
            "$sdk_apksigner" verify --print-certs "$apk" 2>&1 |
            awk -F': ' '/certificate SHA-256 digest/ { print $2; exit }' |
            tr -d ':' | tr '[:lower:]' '[:upper:]'
          )"

          test -n "$expected_fp"
          test -n "$actual_fp"
          test "$expected_fp" = "$actual_fp"
          test "$actual_fp" = "$EXPECTED_RELEASE_CERT_SHA256"
          echo "MATHMASTER_RELEASE_CERT_SHA256=$actual_fp" >> "$GITHUB_ENV"

          echo "APK applicationId/version/signature/installability verified."
          echo "Certificate SHA-256: $actual_fp"

      - name: Collect release APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/release -type f -name '*release*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" MathMaster-release.apk
          ls -lh MathMaster-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: MathMaster-release
          path: MathMaster-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest GitHub Release APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE="${VERSION_CODE:?Missing resolved versionCode}"
          VERSION_NAME="${VERSION_NAME:?Missing resolved versionName}"
          CERT_SHA256="${MATHMASTER_RELEASE_CERT_SHA256:?Missing verified release certificate fingerprint}"
          release_tag="latest"
          release_title="MathMaster ${VERSION_NAME} (${VERSION_CODE})"
          release_notes="$(printf 'Automated signed Android release.\nversionCode: %s\nversionName: %s\nsourceCommit: %s\napplicationId: %s\nsigningCertificateSHA256: %s\n' \\
            "$VERSION_CODE" "$VERSION_NAME" "$GITHUB_SHA" "com.sudhanshu.mathsbj" "$CERT_SHA256")"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release edit "$release_tag" --title "$release_title" --notes "$release_notes"
            gh release upload "$release_tag" MathMaster-release.apk --clobber
          else
            gh release create "$release_tag" MathMaster-release.apk --title "$release_title" --notes "$release_notes" --target "$GITHUB_SHA"
          fi

      - name: Prepare public update manifest and APK
        shell: bash
        env:
          EXPECTED_APPLICATION_ID: "com.sudhanshu.mathsbj"
        run: |
          set -euo pipefail
          VERSION_CODE="${VERSION_CODE:?Missing resolved versionCode}"
          VERSION_NAME="${VERSION_NAME:?Missing resolved versionName}"
          mkdir -p dist/updates
          cp MathMaster-release.apk dist/updates/MathMaster-release.apk
          APK_SHA256="$(sha256sum dist/updates/MathMaster-release.apk | awk '{print $1}')"
          export VERSION_CODE APK_SHA256 VERSION_NAME EXPECTED_APPLICATION_ID
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          version_code = int(os.environ["VERSION_CODE"])
          manifest = {
              "packageName": os.environ["EXPECTED_APPLICATION_ID"],
              "versionCode": version_code,
              "versionName": os.environ["VERSION_NAME"],
              "apkUrl": "https://sudhanshu1920.github.io/mathsbj/updates/MathMaster-release.apk",
              "sha256": os.environ["APK_SHA256"].lower(),
              "releaseNotes": f"MathMaster build {version_code}",
              "publishedAt": datetime.now(timezone.utc).isoformat(),
          }
          if version_code <= 0 or len(manifest["sha256"]) != 64:
              raise SystemExit("Update manifest version or checksum is invalid")
          Path("dist/updates/update.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          test -s dist/updates/update.json
          test -s dist/updates/MathMaster-release.apk

      - name: Upload update feed bundle for hosting
        uses: actions/upload-artifact@v4
        with:
          name: MathMaster-update-feed
          path: dist/updates/
          if-no-files-found: error
          retention-days: 14


# [BUILD_APK] Native updater registration is kept in the final MainActivity.
# [BUILD_APK] Release build requested after runtime crash fix.
